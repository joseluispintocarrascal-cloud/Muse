function setMood(m,ms){mood=m;moodT=performance.now()+(ms||6000);if(m=='happy')waveT=2.2;if(m=='surprised')jump=1}
var last=performance.now()/1000,nextBl=2,blS=-9;
function tick(){requestAnimationFrame(tick);if(document.hidden)return;
var t=performance.now()/1000,dt=Math.min(.05,t-last);last=t;
if(mood!='neutral'&&!busy&&performance.now()>moodT)mood='neutral';
var tg=M[mood],k=1-Math.exp(-dt*8);for(var key in cur)cur[key]+=(tg[key]-cur[key])*k;
gz.x+=(ptr.x-gz.x)*k;gz.y+=(ptr.y-gz.y)*k;
if(t>nextBl){blS=t;nextBl=t+2+Math.random()*3.5;if(Math.random()<.2)nextBl=t+.35}
var bl=Math.max(0,1-Math.abs((t-blS)/.08-1));
var gx=gz.x*.7+cur.gx,gy=-gz.y*.5+cur.gy;
eyes.forEach(function(e){e.position.x=e.userData.bx+gx*.04;e.position.y=e.userData.by+gy*.035;e.scale.set(cur.e,cur.e*(1-.92*bl),1)});
brows.forEach(function(b){b.position.y=b.userData.by+.02+cur.by;b.rotation.z=-b.userData.s*cur.b});
head.children.forEach(function(o){if(o.userData.ch)o.material.opacity=cur.bl*.7});
earG.forEach(function(e){e.rotation.z=-e.userData.s*(.3-cur.er)+Math.sin(t*1.7+e.userData.s)*.02});
head.rotation.y=gx*.24;head.rotation.x=-gy*.14;head.rotation.z=.03*Math.sin(t*.9)+(mood=='thinking'?.1:0);
/* lip-sync */
pulse*=Math.exp(-dt*7);
var to=cur.o,tw=1;
if(speaking){var osc=.5+.5*Math.sin(t*13)*(.6+.4*Math.sin(t*4.3));to=.12+vis[0]*(.25+.55*osc)*(.5+.5*pulse+.4);tw=vis[1]*(.9+.1*Math.sin(t*9))}
open+=(to-open)*(1-Math.exp(-dt*(speaking?26:10)));wid+=(tw-wid)*(1-Math.exp(-dt*18));
mouthO.visible=open>.06;mouthO.scale.set(wid*(1-.2*open),Math.max(.02,open*1.6),1);mouthO.position.y=-.2-.03*open;
mouthC.visible=open<.28;mouthC.scale.set(1,Math.max(.12,Math.abs(cur.c)),1);mouthC.rotation.z=cur.c>=0?Math.PI:0;
/* idle: respiración, flotación, saludo */
var br=Math.sin(t*2);body.scale.set(1+.012*br,1+.02*br,1+.012*br);head.position.y=.82+.025*Math.sin(t*2+.5);
jump=Math.max(0,jump-dt*1.8);
av.position.y=.06*Math.sin(t*1.3)+Math.sin(jump*Math.PI)*.3;av.rotation.y=.1*Math.sin(t*.7);
waveT=Math.max(0,waveT-dt);var w=Math.min(1,waveT*1.5);
armR.rotation.z=.35+2.3*w+Math.sin(t*11)*.28*w;armR.rotation.x=0;
if(Math.floor(t)%14==0&&waveT==0&&!speaking&&Math.random()<.02)waveT=2;
var ty=chatOpen?-1.3:.25,tz=chatOpen?baseZ*1.6:baseZ;camY+=(ty-camY)*k;camZ+=(tz-camZ)*k;cam.position.set(0,camY+.1,camZ);cam.lookAt(0,camY,0);
R.render(scene,cam)}

/* voz: síntesis con visemas por vocal */
var SS=window.speechSynthesis;
function loadV(){voices=SS?SS.getVoices().filter(function(v){return /^es/i.test(v.lang)}):[]}
if(SS){loadV();SS.onvoiceschanged=loadV}
function pickVoice(){if(S.voice){var f=voices.find(function(x){return x.name===S.voice});if(f)return f}return voices.find(function(x){return /neural|natural|online|wavenet/i.test(x.name)})||voices.find(function(x){return /google/i.test(x.name)})||voices[0]}
function say(text,done){
if(!SS||!(S.speak||voiceMode)){done&&done();return}
SS.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='es-ES';
var v=pickVoice();if(v){u.voice=v;u.lang=v.lang}
u.pitch=S.pitch;u.rate=S.rate;
u.onstart=function(){speaking=true};
u.onboundary=function(e){pulse=1;var s=text.slice(e.charIndex||0,(e.charIndex||0)+8).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),m=/[aeiou]/.exec(s);if(m)vis=VIS[m[0]]};
var fin=function(){speaking=false;vis=[.4,1];done&&done()};u.onend=fin;u.onerror=fin;SS.speak(u)}
/* voz: reconocimiento */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(){if(!SR||!voiceMode||busy||speaking||listening)return;
try{rec=new SR();rec.lang='es-ES';rec.interimResults=false;
rec.onresult=function(e){var t=e.results[0][0].transcript;if(t)send(t)};
rec.onerror=function(e){listening=false;if(e.error!='no-speech'&&e.error!='aborted'){voiceMode=false;var ms={'not-allowed':'Micrófono bloqueado. Permite el micrófono en el navegador o abre esta página en su propia pestaña con Chrome.','service-not-allowed':'Este navegador o entorno no permite el reconocimiento de voz. Abre la página en su propia pestaña con Chrome.','audio-capture':'No se detecta ningún micrófono.','network':'Sin conexión con el servicio de voz.'};hint(ms[e.error]||'Micrófono no disponible ('+e.error+').')}chips()};
rec.onend=function(){listening=false;chips();if(voiceMode&&!busy&&!speaking)setTimeout(listen,500)};
rec.start();listening=true;chips()}catch(e){voiceMode=false;chips()}}

function clean(t){return t.replace(/^\s*\[[^\]]*\]?\s*/,'')}
async function send(txt){
var t=(txt||'').trim();if(!t||busy)return;busy=true;
if(SS)SS.cancel();hist.push({role:'user',content:t});hint('Tú: '+t,4000);setMood('thinking',60000);chips();

var msgs=hist.slice(-10).map(function(m){return{role:m.role,content:m.content}});
msgs[msgs.length-1]={role:'user',content:inst+'\n\nMensaje del usuario: '+t};
var out='',tag='neutral';

catch(e){var f=fb[Math.floor(Math.random()*fb.length)];tag=f[0];out=f[1]}
